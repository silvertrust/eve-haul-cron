```yaml
name: Test Byet Browser

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Open Byet wp-cron
        env:
          CRON_URL: https://eve-houl.byethost15.com/wp-cron.php
          STATUS_URL: https://eve-houl.byethost15.com/wp-json/eve-haul/v1/test-cron-status
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
              const browser = await chromium.launch({
                  headless: true
              });

              const context = await browser.newContext({
                  userAgent:
                      'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 ' +
                      '(KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36'
              });

              const page = await context.newPage();

              console.log('Opening cron:', process.env.CRON_URL);

              const cronResponse = await page.goto(
                  process.env.CRON_URL,
                  {
                      waitUntil: 'networkidle',
                      timeout: 60000
                  }
              );

              console.log(
                  'Cron HTTP status:',
                  cronResponse ? cronResponse.status() : 'none'
              );

              console.log('Cron final URL:', page.url());

              console.log(
                  'Cron body:',
                  (await page.locator('body').innerText()).slice(0, 1000)
              );

              console.log('Waiting 5 seconds...');
```
