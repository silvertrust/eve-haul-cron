name: EVE Haul Cron

on:
  workflow_dispatch:

jobs:
  cron:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Trigger WP-Cron
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
              const slash = String.fromCharCode(47);

              const baseUrl =
                  'https:' + slash + slash + 'eve-houl.byethost15.com';

              const cronUrl =
                  baseUrl + slash + 'wp-cron.php';

              const statusUrl =
                  baseUrl +
                  slash + 'wp-json' +
                  slash + 'eve-haul' +
                  slash + 'v1' +
                  slash + 'test-jita-status';

              const browser = await chromium.launch({
                  headless: true
              });

              const page = await browser.newPage();

              console.log('Opening:', cronUrl);

              page.goto(cronUrl, {
                  waitUntil: 'commit',
                  timeout: 30000
              }).catch((error) => {
                  console.log(
                      'Cron request ended:',
                      error.message
                  );
              });

              console.log('Cron request sent.');

              await page.waitForTimeout(5000);

              console.log('Checking status:', statusUrl);

              const response = await page.goto(
                  statusUrl,
                  {
                      waitUntil: 'domcontentloaded',
                      timeout: 30000
                  }
              );

              console.log(
                  'Status HTTP:',
                  response ? response.status() : 'none'
              );

              console.log(
                  'Status:',
                  await page.locator('body').innerText()
              );

              await browser.close();
          })();
          EOF
