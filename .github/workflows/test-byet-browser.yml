name: EVE Haul Market Import

on:
  workflow_dispatch:

  schedule:
    - cron:  '*/10 * * * *'

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Start all region imports
        env:
          CRON_KEY: ${{ secrets.EVE_HAUL_CRON_KEY }}
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
              const slash = String.fromCharCode(47);

              const baseUrl =
                  'https:' + slash + slash + 'eve-houl.byethost15.com';

              const regions = [
                  10000002,
                  10000043,
                  10000032,
                  10000030,
                  10000042
              ];

              const browser = await chromium.launch({
                  headless: true
              });

              const pages = await Promise.all(
                  regions.map(async (regionId) => {
                      const page = await browser.newPage();

                      const url =
                          baseUrl +
                          slash + 'wp-json' +
                          slash + 'eve-haul' +
                          slash + 'v1' +
                          slash + 'market' +
                          slash + 'cron-import' +
                          '?region_id=' + regionId +
                          '&key=' + encodeURIComponent(process.env.CRON_KEY);

                      console.log(
                          'Starting region:',
                          regionId
                      );

                      page.goto(url, {
    waitUntil: 'commit',
    timeout: 30000
}).then((response) => {
    console.log(
        'Region',
        regionId,
        'HTTP:',
        response ? response.status() : 'NO RESPONSE'
    );
}).catch((error) => {
    console.log(
        'Region',
        regionId,
        'request ended:',
        error.message
    );
});

                      return page;
                  })
              );

              console.log(
                  'All region requests sent:',
                  regions.join(', ')
              );

              await new Promise(
                  resolve => setTimeout(resolve, 5000)
              );

              for (const page of pages) {
                  await page.close().catch(() => {});
              }

              await browser.close();

              console.log('Done.');
          })();
          EOF
