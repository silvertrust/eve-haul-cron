name: Test Byet Browser

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Open Byet wp-cron
        env:
          CRON_URL: https://eve-houl.byethost15.com/wp-cron.php
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
              const browser = await chromium.launch({
                  headless: true
              });

              const page = await browser.newPage();

              console.log('Opening:', process.env.CRON_URL);

              const response = await page.goto(
                  process.env.CRON_URL,
                  {
                      waitUntil: 'networkidle',
                      timeout: 60000
                  }
              );

              await page.waitForTimeout(3000);

const statusResponse = await page.goto(
    'https://eve-houl.byethost15.com/wp-json/eve-haul/v1/test-cron-status',
    {
        waitUntil: 'networkidle',
        timeout: 30000
    }
);

console.log('Status HTTP:', statusResponse ? statusResponse.status() : 'none');
console.log('Status body:', await page.locator('body').innerText());

              console.log('HTTP status:', response ? response.status() : 'none');
              console.log('Final URL:', page.url());
              console.log('Title:', await page.title());
              console.log('Body:', (await page.locator('body').innerText()).slice(0, 1000));

              await browser.close();
          })();
          EOF
