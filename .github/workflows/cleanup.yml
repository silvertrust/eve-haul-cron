name: EVE Haul Cleanup

on:
  workflow_dispatch:

  schedule:
    - cron: '0 */3 * * *'

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run cleanup
        env:
          CRON_KEY: ${{ secrets.EVE_HAUL_CRON_KEY }}
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
              const slash = String.fromCharCode(47);

              const baseUrl =
                  'https:' + slash + slash + 'eve-houl.byethost15.com';

              const url =
                  baseUrl +
                  slash + 'wp-json' +
                  slash + 'eve-haul' +
                  slash + 'v1' +
                  slash + 'market' +
                  slash + 'cleanup' +
                  '?key=' + encodeURIComponent(process.env.CRON_KEY);

              console.log('Starting cleanup...');

              const browser = await chromium.launch({
                  headless: true
              });

              const page = await browser.newPage();

              try {
                  const response = await page.goto(url, {
                      waitUntil: 'commit',
                      timeout: 60000
                  });

                  console.log(
                      'Initial HTTP:',
                      response ? response.status() : 'NO RESPONSE'
                  );

                  await page.waitForLoadState('domcontentloaded', {
                      timeout: 15000
                  }).catch(() => {});

                  const body = (
                      await page.locator('body').innerText()
                  ).trim();

                  console.log(
                      'Cleanup BODY:',
                      body.substring(0, 2000)
                  );

                  if (!response || !response.ok()) {
                      throw new Error(
                          'Cleanup HTTP request failed: ' +
                          (response ? response.status() : 'no response')
                      );
                  }

                  let result;

                  try {
                      result = JSON.parse(body);
                  } catch {
                      throw new Error(
                          'Cleanup did not return valid JSON.'
                      );
                  }

                  const requiredFields = [
                      'deleted_snapshots',
                      'deleted_orders',
                      'skipped_current',
                      'skipped_historical'
                  ];

                  for (const field of requiredFields) {
                      if (
                          !Object.prototype.hasOwnProperty.call(result, field) ||
                          !Number.isFinite(Number(result[field]))
                      ) {
                          throw new Error(
                              'Invalid cleanup response field: ' + field
                          );
                      }
                  }

                  console.log('Cleanup completed successfully.');
                  console.log(JSON.stringify(result));

              } catch (error) {
                  console.error('Cleanup failed:', error.message);
                  process.exitCode = 1;

              } finally {
                  await page.close().catch(() => {});
                  await browser.close();
              }

              console.log('Done.');
          })();
          EOF
