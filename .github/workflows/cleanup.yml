name: EVE Haul Cleanup

on:
  workflow_dispatch:

  schedule:
    - cron: '0 */3 * * *'

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run cleanup
        env:
          CRON_KEY: ${{ secrets.EVE_HAUL_CRON_KEY }}
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
              const slash = String.fromCharCode(47);

              const baseUrl =
                  'https:' + slash + slash + 'eve-houl.byethost15.com';

              const url =
                  baseUrl +
                  slash + 'wp-json' +
                  slash + 'eve-haul' +
                  slash + 'v1' +
                  slash + 'market' +
                  slash + 'cleanup' +
                  '?key=' + encodeURIComponent(process.env.CRON_KEY);

              console.log('Starting cleanup...');

              const browser = await chromium.launch({
                  headless: true
              });

              const page = await browser.newPage();

              try {
                  page.goto(url, {
                      waitUntil: 'commit',
                      timeout: 30000
                  }).then((response) => {
                      console.log(
                          'Initial HTTP:',
                          response
                              ? response.status()
                              : 'NO RESPONSE'
                      );
                  }).catch((error) => {
                      console.log(
                          'Initial request:',
                          error.message
                      );
                  });

                  const startedAt = Date.now();

                  while (Date.now() - startedAt < 30000) {
                      const currentUrl = page.url();

                      if (currentUrl.includes('i=1')) {
                          console.log(
                              'Anti-bot challenge completed.'
                          );

                          break;
                      }

                      await new Promise(
                          resolve => setTimeout(resolve, 500)
                      );
                  }

                  const finalUrl = page.url();

                  console.log(
                      'Final URL:',
                      finalUrl.replace(
                          process.env.CRON_KEY,
                          '***'
                      )
                  );

                  const body = await page.locator('body').innerText();

                  console.log(
                      'Cleanup BODY:',
                      body.substring(0, 2000)
                  );

                  if (!finalUrl.includes('i=1')) {
                      throw new Error(
                          'Anti-bot challenge did not complete within 30 seconds.'
                      );
                  }

                  console.log(
                      'Cleanup request completed.'
                  );

              } catch (error) {
                  console.log(
                      'Cleanup failed:',
                      error.message
                  );

                  process.exitCode = 1;

              } finally {
                  await page.close().catch(() => {});
                  await browser.close();
              }

              console.log('Done.');
          })();
          EOF
